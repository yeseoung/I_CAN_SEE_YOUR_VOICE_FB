<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17191C">
<title>SORI — 수어 화상회의</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<!-- React는 빌드 없이 CDN에서 불러온다. react-dom은 같은 react 하나를 쓰도록 external로 받는다 -->
<script type="importmap">
{
    "imports": {
        "react": "https://esm.sh/react@19.1.0",
        "react-dom/client": "https://esm.sh/react-dom@19.1.0/client?external=react",
        "htm": "https://esm.sh/htm@3.1.1"
    }
}
</script>
<style>
    :root {
        color-scheme: light;
        --paper: #F1F2EE;
        --surface: #FFFFFF;
        --ink: #17191C;
        --ink-2: #5F656C;
        --line: #DCDED8;
        --caption: #FFD43B;   /* 방송 자막의 노란색: 영상 위에서 가장 잘 읽힌다 */
        --stage: #1C1F23;
        --live: #1E9E63;
        --danger: #D93B30;
        --font: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
        min-height: 100vh; background: var(--paper); color: var(--ink);
        font-family: var(--font); font-size: 16px; line-height: 1.55;
        -webkit-font-smoothing: antialiased; font-feature-settings: "tnum";
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    h1, h2, p { margin: 0; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

    /* 버튼 */
    .btn {
        appearance: none; border: 1.5px solid transparent; border-radius: 12px;
        padding: 12px 18px; font-weight: 650; font-size: 15px; line-height: 1.2;
        display: inline-flex; align-items: center; justify-content: center; gap: 10px;
        transition: background .15s, border-color .15s, transform .1s;
    }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn-block { width: 100%; }
    .btn-sm { padding: 8px 14px; font-size: 14px; border-radius: 10px; }
    .btn-primary { background: var(--ink); color: #fff; }
    .btn-primary:hover { background: #2C3035; }
    .btn-caption { background: var(--caption); color: var(--ink); }
    .btn-caption:hover { background: #FFDC5E; }
    .btn-line { background: var(--surface); border-color: var(--line); }
    .btn-line:hover { border-color: var(--ink); }
    .btn-apple { background: #000; color: #fff; }
    .btn-apple:hover { background: #222; }
    .btn svg { width: 18px; height: 18px; flex: none; }
    .link-btn { background: none; border: 0; padding: 6px 4px; color: var(--ink-2); font-size: 14px; font-weight: 600; }
    .link-btn:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

    .field { display: block; margin-bottom: 14px; }
    .field span { display: block; font-size: 14px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
    .field input, .code-input {
        width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line);
        background: var(--surface); outline: none; transition: border-color .15s;
    }
    .field input:focus, .code-input:focus { border-color: var(--ink); }
    .msg { min-height: 22px; margin-top: 12px; font-size: 14px; color: var(--danger); }
    .msg.info { color: var(--ink-2); }

    .wordmark { font-weight: 800; font-size: 20px; letter-spacing: .02em; }
    .avatar {
        width: 34px; height: 34px; border-radius: 50%; flex: none;
        display: inline-flex; align-items: center; justify-content: center;
        background: var(--caption); color: var(--ink); font-weight: 800; font-size: 15px;
    }
    .avatar-lg { width: 60px; height: 60px; font-size: 24px; }

    /* 자막: 회의실과 로그인 데모가 같은 모양을 쓴다 */
    .caption {
        position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
        width: max-content; max-width: calc(100% - 32px);
        padding: 8px 16px; border-radius: 10px; background: rgba(10, 11, 13, .82);
        color: var(--caption); font-weight: 700; font-size: clamp(20px, 2.3vw, 30px);
        line-height: 1.35; text-align: center; word-break: keep-all; overflow-wrap: anywhere;
    }
    .composing { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 6px; }

    /* 로그인 */
    .login { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); }
    .login-hero {
        background: var(--ink); color: #fff; padding: clamp(28px, 5vw, 64px);
        display: flex; flex-direction: column; justify-content: space-between; gap: 40px;
    }
    .hero-body { max-width: 560px; }
    .hero-body h1 { font-size: clamp(34px, 4.4vw, 56px); line-height: 1.18; font-weight: 800; letter-spacing: -.025em; }
    .hero-body > p { margin-top: 16px; color: #B4BAC1; font-size: 17px; max-width: 34ch; }
    .demo-tile {
        position: relative; margin-top: clamp(28px, 5vh, 48px); aspect-ratio: 16 / 9; border-radius: 20px; overflow: hidden;
        background: radial-gradient(60% 80% at 50% 40%, #3A3F46 0%, #24272C 60%, #1A1C20 100%);
    }
    .demo-name, .tile-name {
        position: absolute; top: 14px; left: 14px; margin: 0; padding: 4px 10px; border-radius: 8px;
        background: rgba(10, 11, 13, .6); color: #fff; font-size: 13px; font-weight: 600;
    }
    .demo-swap { display: inline-grid; }
    .demo-swap > * { grid-area: 1 / 1; }
    .demo-swap .f1 { opacity: 0; animation: show .2s .5s forwards, hide .01s 1.5s forwards; }
    .demo-swap .f2 { opacity: 0; animation: show .2s 1.5s forwards; }
    @keyframes show { to { opacity: 1; } }
    @keyframes hide { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
        .demo-swap .f1 { display: none; }
        .demo-swap .f2 { animation: none; opacity: 1; }
    }
    .hero-foot { color: #80878F; font-size: 14px; }

    .login-panel { display: flex; align-items: center; justify-content: center; padding: clamp(28px, 5vw, 64px); }
    .login-box { width: min(360px, 100%); }
    .login-box h2 { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
    .login-box .lead { margin: 6px 0 26px; color: var(--ink-2); font-size: 15px; }
    .sep { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: var(--ink-2); font-size: 13px; }
    .sep::before, .sep::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .social { display: grid; gap: 10px; }
    .hint { margin-top: 22px; color: var(--ink-2); font-size: 13px; }
    @media (max-width: 880px) {
        .login { grid-template-columns: 1fr; }
        .login-hero { gap: 28px; }
    }

    /* 앱 헤더 */
    .appbar { position: sticky; top: 0; z-index: 10; background: rgba(241, 242, 238, .9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .appbar-inner { max-width: 1040px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 20px; }
    .wordmark-btn { background: none; border: 0; padding: 4px; }
    .topnav { display: flex; gap: 2px; }
    .navlink { background: none; border: 0; padding: 8px 12px; border-radius: 10px; color: var(--ink-2); font-weight: 650; font-size: 15px; }
    .navlink:hover { color: var(--ink); }
    .navlink.active { color: var(--ink); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
    .userchip { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .uname { font-weight: 650; font-size: 15px; }
    @media (max-width: 560px) { .uname { display: none; } }

    /* 홈 */
    .page { max-width: 1040px; margin: 0 auto; padding: 40px 20px 64px; }
    .page-narrow { max-width: 640px; }
    .greet { font-size: clamp(28px, 3.4vw, 38px); font-weight: 800; letter-spacing: -.02em; line-height: 1.25; }
    .greet-sub { margin: 6px 0 28px; color: var(--ink-2); }
    .paths { display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; }
    @media (max-width: 680px) { .paths { grid-template-columns: 1fr; } }
    .path { padding: 26px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; }
    .path h2 { font-size: 19px; font-weight: 750; }
    .path p { margin: 6px 0 22px; color: var(--ink-2); font-size: 15px; flex: 1; }
    .path-new { background: var(--ink); border-color: var(--ink); color: #fff; }
    .path-new p { color: #B4BAC1; }
    .join-row { display: flex; gap: 8px; }
    .code-input { flex: 1; min-width: 0; letter-spacing: .12em; }

    .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 0 12px; }
    .section-head h2 { font-size: 18px; font-weight: 750; }
    .ml { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .ml-row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; }
    .ml-row + .ml-row { border-top: 1px solid var(--line); }
    .ml-live { flex: none; padding: 3px 10px; border-radius: 999px; background: var(--paper); color: var(--ink-2); font-size: 12px; font-weight: 700; }
    .ml-live.on { background: rgba(30, 158, 99, .12); color: var(--live); }
    .ml-code { font-weight: 700; letter-spacing: .1em; }
    .ml-host, .ml-count { color: var(--ink-2); font-size: 14px; }
    .ml-count { margin-left: auto; }
    @media (max-width: 560px) { .ml-host { display: none; } }
    .ml-empty { padding: 28px 16px; text-align: center; color: var(--ink-2); font-size: 15px; background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; }

    /* 마이페이지 */
    .page-title { font-size: clamp(26px, 3vw, 32px); font-weight: 800; letter-spacing: -.02em; margin-bottom: 22px; }
    .profile { display: flex; align-items: center; gap: 16px; }
    .profile-name { font-size: 21px; font-weight: 750; }
    .profile-meta { color: var(--ink-2); font-size: 15px; }
    .info { margin: 24px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
    .info > div { display: flex; justify-content: space-between; gap: 16px; padding: 14px 18px; }
    .info > div + div { border-top: 1px solid var(--line); }
    .info dt { color: var(--ink-2); }
    .info dd { margin: 0; font-weight: 600; }
    .sub-title { margin: 32px 0 10px; font-size: 18px; font-weight: 750; }
    .setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; cursor: pointer; }
    .switch {
        appearance: none; flex: none; margin: 0; width: 46px; height: 28px; border-radius: 999px;
        background: #C9CCC5; position: relative; cursor: pointer; transition: background .15s;
    }
    .switch::after {
        content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
        background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s;
    }
    .switch:checked { background: var(--ink); }
    .switch:checked::after { transform: translateX(18px); }

    /* 회의실 */
    .room { min-height: 100vh; display: flex; flex-direction: column; background: var(--stage); color: #fff; }
    .room-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 20px; }
    .conn { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #C3C8CE; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 4px rgba(30, 158, 99, .25); }
    .codechip { display: inline-flex; align-items: center; gap: 10px; padding: 5px 5px 5px 14px; border-radius: 12px; background: rgba(255, 255, 255, .07); }
    .codechip-label { font-size: 13px; color: #9AA1A9; }
    .codechip-code { font-weight: 700; letter-spacing: .12em; }
    .copy { border: 0; padding: 6px 12px; border-radius: 8px; background: rgba(255, 255, 255, .1); font-size: 13px; font-weight: 650; }
    .copy:hover { background: rgba(255, 255, 255, .18); }
    .copy.copied { background: var(--caption); color: var(--ink); }
    .room :focus-visible { outline-color: var(--caption); }

    .stage {
        flex: 1; width: 100%; max-width: 1400px; margin: 0 auto; padding: 8px 20px 110px;
        display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); align-content: center;
    }
    .stage.solo { grid-template-columns: minmax(0, 880px); justify-content: center; }
    .tile { position: relative; margin: 0; aspect-ratio: 4 / 3; border-radius: 20px; overflow: hidden; background: #0E1012; }
    .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile.local video { transform: scaleX(-1); }
    .tile-wait { position: absolute; inset: 0; display: grid; place-items: center; color: #80878F; font-size: 15px; }
    .waiting { text-align: center; color: #9AA1A9; font-size: 15px; }
    .waiting b { color: #fff; letter-spacing: .1em; }

    .dock {
        position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 5;
        display: flex; gap: 8px; padding: 8px; border-radius: 18px; flex-wrap: wrap; justify-content: center;
        background: rgba(40, 44, 49, .92); backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
        width: max-content; max-width: calc(100% - 24px);
    }
    .pill {
        display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 12px;
        border: 0; background: rgba(255, 255, 255, .08); color: #fff; font-size: 14px; font-weight: 650; white-space: nowrap;
    }
    .pill:hover { background: rgba(255, 255, 255, .16); }
    .pill-dot { width: 9px; height: 9px; border-radius: 50%; background: #6B7178; }
    .pill.on { background: var(--caption); color: var(--ink); }
    .pill.on .pill-dot { background: var(--ink); }
    .pill-select span { color: #9AA1A9; }
    .pill-select select { appearance: none; background: none; border: 0; padding: 0 16px 0 0; font-weight: 650; cursor: pointer;
        background-image: linear-gradient(45deg, transparent 50%, #fff 50%), linear-gradient(135deg, #fff 50%, transparent 50%);
        background-position: right 5px center, right 0 center; background-size: 5px 5px; background-repeat: no-repeat; }
    .pill-select select option { color: var(--ink); }
    .pill-leave { background: var(--danger); }
    .pill-leave:hover { background: #E5554A; }
</style>
</head>
<body>
<div id="root"></div>
<noscript>이 앱은 JavaScript가 필요합니다.</noscript>
<script type="module" src="/static/app.js"></script>
</body>
</html>
