[project]
name = "model-api-test"
version = "0.1.0"
description = "SORI: real-time Korean Sign Language fingerspelling recognition server with video meetings (FastAPI + MediaPipe)"
readme = "README.md"
authors = [
    { name = "고예성" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156.8",
    "mediapipe>=1.1.1",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "tensorflow>=2.21.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
